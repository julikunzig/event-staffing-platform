version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: event_staffing_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: event_staffing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: event_staffing_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  mailhog:
    image: mailhog/mailhog:latest
    container_name: event_staffing_mailhog
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Web UI port
    environment:
      MH_SMTP_BIND_ADDR: 0.0.0.0:1025
      MH_UI_WEB_PATH: /

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: event_staffing_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/event_staffing
      JWT_SECRET: dev-secret-change-in-production-32chars
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_HOURS: "8"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_TEST_EMAIL: ${RESEND_TEST_EMAIL:-}
      USE_MAILHOG: "false"
      MAILHOG_HOST: mailhog
      MAILHOG_PORT: "1025"
      ENVIRONMENT: development
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-whatsapp:+14155238886}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
